name: "trials-ha-addon"
description: "ECHONET Lite to MQTT bridge."
version: "1.0.0"
url: https://github.com/banban525/trials-ha-addon
slug: "trials-ha-addon"
arch:
  - aarch64
  - amd64
init: false
host_network: true
services:
  - mqtt:need
ingress: true
ingress_port: 8099
map:
  - path: "/addon_config"
    type: addon_config
    read_only: false
  - path: "/ssl"
    type: ssl
    read_only: true
  - path: "/data"
    type: data
    read_only: false
options:
  mqtt: {}
  echonet: {
    device_ip_list: []
  }
  device_ip_list: []
schema:
  mqtt:
    broker: str?
    option_file: str?
    ca_file: str?
    cert_file: str?
    key_file: str?
    base_topic: str?
  echonet:
    target_network: str?
    device_ip_list:
      - str
    command_timeout: int?
    disable_auto_device_discovery: bool?
    alias_file: str?
    legacy_multi_nic_mode: int?
    unknown_as_error: bool?
  device_ip_list:
    - str

